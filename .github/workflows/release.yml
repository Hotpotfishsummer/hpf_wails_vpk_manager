name: Build and Release

on:
  push:
    branches:
      - main
    paths:
      - 'wails.json'
      - 'frontend/package.json'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (leave empty to use version from wails.json)'
        required: false
        default: ''
        type: string
      draft:
        description: 'Publish as draft'
        required: false
        default: false
        type: boolean
      prerelease:
        description: 'Publish as pre-release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version & Trigger Condition
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      tag_name: ${{ steps.check.outputs.tag_name }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Target Version and Release Trigger
        id: check
        shell: pwsh
        run: |
          # 1. 尝试从 wails.json 或 frontend/package.json 获取当前版本号
          $currVer = ""
          if (Test-Path "wails.json") {
            try {
              $currVer = (Get-Content "wails.json" -Raw | ConvertFrom-Json).info.productVersion
            } catch {}
          }
          if (-not $currVer -and (Test-Path "frontend/package.json")) {
            try {
              $currVer = (Get-Content "frontend/package.json" -Raw | ConvertFrom-Json).version
            } catch {}
          }

          if ($currVer) {
            $currVer = $currVer.Trim().TrimStart('v')
          }
          Write-Host "Current codebase version: $currVer"

          $eventName = "${{ github.event_name }}"
          $shouldRelease = "false"
          $targetTag = ""

          if ($eventName -eq "workflow_dispatch") {
            # 手动触发模式
            $inputTag = "${{ inputs.tag_name }}".Trim()
            if ($inputTag) {
              $targetTag = if ($inputTag.StartsWith('v')) { $inputTag } else { "v$inputTag" }
            } elseif ($currVer) {
              $targetTag = "v$currVer"
            } else {
              $targetTag = "v1.0.0"
            }
            $shouldRelease = "true"
            Write-Host "Workflow dispatched manually with target tag: $targetTag"
          } elseif ($eventName -eq "push" -and "${{ github.ref_type }}" -eq "tag") {
            # Git Tag 推送触发
            $targetTag = "${{ github.ref_name }}"
            $shouldRelease = "true"
            Write-Host "Triggered by git tag push: $targetTag"
          } else {
            # Push 到 main 分支触发
            if (-not $currVer) {
              Write-Host "::warning::No version found in wails.json or package.json. Skipping release."
              $shouldRelease = "false"
            } else {
              $targetTag = "v$currVer"

              # 获取变更前提交中的版本号
              $prevVer = ""
              $beforeSha = "${{ github.event.before }}"
              if ($beforeSha -and $beforeSha -ne "0000000000000000000000000000000000000000") {
                try {
                  $prevWails = git show "$($beforeSha):wails.json" 2>$null
                  if ($prevWails) {
                    $prevVer = ($prevWails | ConvertFrom-Json).info.productVersion
                  }
                } catch {}
                if (-not $prevVer) {
                  try {
                    $prevPkg = git show "$($beforeSha):frontend/package.json" 2>$null
                    if ($prevPkg) {
                      $prevVer = ($prevPkg | ConvertFrom-Json).version
                    }
                  } catch {}
                }
              }
              if ($prevVer) {
                $prevVer = $prevVer.Trim().TrimStart('v')
              }
              Write-Host "Previous commit version: $prevVer"

              # 检查该 tag 是否已存在
              git fetch --tags origin 2>$null
              $tagExists = $(git tag -l $targetTag)

              if ($currVer -ne $prevVer) {
                if ($tagExists) {
                  Write-Host "::warning::Version changed to $currVer, but tag $targetTag already exists! Skipping to prevent overwrite."
                  $shouldRelease = "false"
                } else {
                  Write-Host "Version change detected: $prevVer -> $currVer. Will trigger release for tag $targetTag!"
                  $shouldRelease = "true"
                }
              } elseif (-not $tagExists) {
                Write-Host "Tag $targetTag does not exist yet. Will trigger release!"
                $shouldRelease = "true"
              } else {
                Write-Host "Version $currVer did not change (prev: $prevVer) and tag $targetTag already exists. Skipping release."
                $shouldRelease = "false"
              }
            }
          }

          "should_release=$shouldRelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          "tag_name=$targetTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  release:
    name: Build & Release (Windows)
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: false # 禁用 Actions 缓存，避免占用计费存储配额

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Wails CLI
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.16.0
          $gopath = go env GOPATH
          "$gopath\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Frontend Dependencies
        shell: pwsh
        working-directory: frontend
        run: |
          npm ci

      - name: Build Application with Wails
        shell: pwsh
        run: |
          wails build -clean -trimpath

      - name: Prepare Release Packages
        id: pkg
        shell: pwsh
        run: |
          $exePath = "build\bin\L4D2-VPK-Manager.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Build output not found at $exePath"
            exit 1
          }

          # 确定版本号 (来自 check-version 的输出)
          $tag = "${{ needs.check-version.outputs.tag_name }}"
          if (-not $tag) {
            $tag = "v1.0.0"
          }

          $zipName = "L4D2-VPK-Manager-$tag-windows-amd64.zip"
          Compress-Archive -Path $exePath -DestinationPath $zipName -Force

          # 生成 SHA256 校验码
          $hash = (Get-FileHash -Path $zipName -Algorithm SHA256).Hash
          "$hash  $zipName" | Out-File -FilePath "$zipName.sha256" -Encoding utf8

          "TAG_NAME=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "ZIP_NAME=$zipName" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Prepared $zipName with SHA256 $hash"

      - name: Publish to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:TAG_NAME
          $zipFile = $env:ZIP_NAME
          $shaFile = "$zipFile.sha256"
          $exeFile = "build\bin\L4D2-VPK-Manager.exe"

          $flags = @()
          if ("${{ inputs.draft }}" -eq "true") { $flags += "--draft" }
          if ("${{ inputs.prerelease }}" -eq "true") { $flags += "--prerelease" }

          # 检查该 tag 的 Release 是否已存在
          $existing = gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists. Uploading/updating assets..."
            gh release upload $tag $zipFile $shaFile $exeFile --clobber
          } else {
            Write-Host "Creating new Release $tag..."
            gh release create $tag $zipFile $shaFile $exeFile `
              --target ${{ github.sha }} `
              --title "L4D2 VPK Manager $tag" `
              --generate-notes `
              @flags
          }

      # 彻底清理 Runner 临时文件，避免占用空间
      - name: Cleanup Runner Workspace
        if: always()
        shell: pwsh
        run: |
          Write-Host "Cleaning runner build files..."
          Remove-Item -Force -Recurse -ErrorAction SilentlyContinue build, *.zip, *.sha256
          Write-Host "Runner cleanup complete. 0 Actions artifacts retained."
